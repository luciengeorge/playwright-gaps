<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
<style>.swiper{width:400px;height:250px;margin:40px}.swiper-slide{display:flex;align-items:center;justify-content:center;background:#ddd;font-size:30px}</style></head>
<body><div class="swiper"><div class="swiper-wrapper"><div class="swiper-slide">Slide 1</div><div class="swiper-slide">Slide 2</div><div class="swiper-slide">Slide 3</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>window.swiper = new Swiper('.swiper', { speed: 0 }); window.swiperVersion = Swiper.version || '11';</script></body></html>
