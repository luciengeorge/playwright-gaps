<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>#map{width:600px;height:450px;margin:20px}</style></head>
<body><div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  window.map = L.map('map', { zoomAnimation: false, fadeAnimation: false, inertia: false }).setView([51.505, -0.09], 10);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
  window.leafletInfo = { touch: L.Browser.touch, pointer: L.Browser.pointer, touchNative: L.Browser.touchNative, touchZoom: map.touchZoom.enabled() };
</script></body></html>
